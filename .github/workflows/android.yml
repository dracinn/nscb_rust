name: Android ARM64 Library

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Check embedded Android backend
        run: cargo check --lib --target aarch64-linux-android
